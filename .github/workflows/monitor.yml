name: STOCKLY external availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: stockly-availability
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout monitoring code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public endpoints and notify outage or recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 monitor.py
